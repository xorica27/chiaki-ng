name: Build Android APK (sideload build)

# chiaki-ng ships no Android artifact: the project has no Android workflow, and its own site states
# that no official mobile app exists yet. This builds the Android app from source and uploads the
# debug APK.
#
# Signing: a freshly provisioned runner has no ~/.android/debug.keystore, so Gradle generates one
# with a random key every run. Each build would then carry a different signature, and installing
# over the previous build fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE. That forces an uninstall,
# which wipes the app data including the Remote Play registration, so the console has to be
# re-paired each time. The build therefore restores one fixed debug keystore from the
# ANDROID_KEYSTORE_B64 secret and installs it at the default path Gradle already looks at.
#
# ABI note: android/app/build.gradle declares no abiFilters, so left alone it builds every ABI.
# This narrows the build to armeabi-v7a, which is what the target Android TV reports for
# ro.product.cpu.abilist. Drop the -P flag to get an APK covering all ABIs instead.

on:
  push:
    branches: ["build/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Install the stable signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -o pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing; the APK signature would change on every build"
            exit 1
          fi
          # The app module reads its signing details from android/local.properties and only
          # applies them when the "chiakiKeystore" key is present. Without it Gradle prints
          # "Signing not enabled" and falls back to a debug keystore that a freshly provisioned
          # runner generates at random, so every build carried a different signature and
          # installing over the previous build failed. Write the project's own keys here so
          # both debug and release sign with this one keystore. local.properties may already
          # exist (sdk.dir), hence append rather than overwrite.
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/signing/debug.keystore" -storepass android -alias androiddebugkey
          {
            echo "chiakiKeystore=$RUNNER_TEMP/signing/debug.keystore"
            echo "chiakiKeystorePW=android"
            echo "chiakiKeyAlias=androiddebugkey"
            echo "chiakiKeyPW=android"
          } >> android/local.properties

      - name: Show toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "${ANDROID_HOME}/ndk" 2>/dev/null || echo "no NDKs preinstalled"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-protobuf
          protoc --version
          # The nanopb generator runs under whichever python CMake finds through
          # find_package(PythonInterp 3). Cover the system python (apt) and any other
          # python3 on PATH (pip), the way the project's own builds do.
          python3 -m pip install --break-system-packages protobuf 2>/dev/null \
            || python3 -m pip install protobuf 2>/dev/null \
            || echo "pip route failed; relying on the apt python3-protobuf package"
          python3 -c "import sys, google.protobuf; print('python protobuf ok:', sys.executable, google.protobuf.__version__)"

      - name: Build debug APK (armeabi-v7a)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace -Pandroid.injected.build.abi=armeabi-v7a

      - name: Locate the APK
        run: |
          # Find it wherever Gradle actually wrote it rather than assuming a path.
          APK=$(find . -name '*.apk' -not -path './.git/*' | head -1)
          if [ -z "$APK" ]; then
            echo "no APK produced; build dirs present:"
            find . -maxdepth 5 -type d -name build -not -path './.git/*'
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -la "$APK"
          unzip -l "$APK" | grep -oE 'lib/[^/]+/' | sort -u

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
